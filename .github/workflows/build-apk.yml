
name: Build Mimic APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Mimic APK
        run: flutter build apk --release

            - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mimic-build-${GITHUB_RUN_NUMBER}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Mimic build ${GITHUB_RUN_NUMBER}" \
            --notes "APK release de Mimic generado con GitHub Actions."